# Trigger the workflow on manual dispatch (not automatically)
on:
  workflow_dispatch:
      
# Permissions to read the contents of the repository
permissions:
  contents: read

# Define the jobs that the workflow will run
jobs:
  manual-wf:
    name: "manual-wf"
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    env:
      FOO: ${{ vars.FOO }}
      GIT_BRANCH_NAME: ${{ github.ref_name }}


    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    # Define the steps that the job will run
    steps:
      - name: Extract branch name
        id: extract_branch
        run: echo "::set-output name=branch_name::${GITHUB_REF#refs/heads/}"

      # Log preliminary info
      - name: Log preliminary info
        run: |
          GIT_BRANCH_NAME=${{env.GIT_REF}}
          echo "🎉 This workflow was automatically triggered by a ${{ github.event_name }} event."
          echo "🔎 Repository is ${{ github.repository }} and branch is ${{ env.GIT_BRANCH_NAME }}"
          echo "🔎 FOO is ${{ env.FOO }}"
